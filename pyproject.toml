[project]
name = "mtb-survival-model"
version = "1.0.0"
description = "Overall survival risk model served from cBioPortal data, for a Molecular Tumor Board portal tab"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }

# Exact versions live in requirements.lock, which is what `make setup` and the
# Dockerfile install. These bounds exist so the intent is readable.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15.0",
    "xgboost>=2.0",
    "scikit-survival>=0.22",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
